name: Optimize portfolio photos
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/optimize_web_photos.py"
      - ".github/workflows/optimize-photos.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Generate optimized web images and update references
        run: python scripts/optimize_web_photos.py
      - name: Commit optimized website images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html photography.html web-images/
          if ! git diff --cached --quiet; then
            git commit -m "Optimize website photos for mobile loading"
            git push
          fi
